<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Симулятор камня</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="c" aria-label="Игровое поле"></canvas>

  <div id="ui">
    <div class="box">Счёт: <span id="score">0</span> · Рекорд: <span id="best">0</span></div>
    <div class="box">
      <label>Скорость машин: <b id="sv">1.0×</b>
        <input id="spd" type="range" min="0.3" max="3" step="0.1" value="1">
      </label>
    </div>
    <div class="box">
      <label>Машин на дороге: <b id="dv">3</b>
        <input id="den" type="range" min="0" max="8" step="1" value="3">
      </label>
    </div>
    <button id="pause">⏸ Пауза</button>
  </div>

  <div id="pad">
    <span></span><button data-d="f">▲</button><span></span>
    <button data-d="l">◀</button><button data-d="b">▼</button><button data-d="r">▶</button>
  </div>

  <div id="ov">
    <h1>🪨 Симулятор камня</h1>
    <p>Перейди дорогу и не попади под машину</p>
    <p>Стрелки / WASD — движение · P или Пробел — пауза</p>
    <button id="go">Играть</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
