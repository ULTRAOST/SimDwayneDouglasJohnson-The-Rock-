<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfe3f5">
  <title>Симулятор камня</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="gameCanvas" aria-label="Игровое поле"></canvas>

  <div id="ui">
    <div class="box">Счёт: <span id="scoreValue">0</span> · Рекорд: <span id="bestScoreValue">0</span></div>
    <div class="box">
      <label>Скорость машин: <b id="carSpeedLabel">1.0×</b>
        <input id="carSpeedSlider" type="range" min="0.3" max="3" step="0.1" value="1">
      </label>
    </div>
    <div class="box">
      <label>Машин на дороге: <b id="carsPerRoadLabel">3</b>
        <input id="carsPerRoadSlider" type="range" min="0" max="8" step="1" value="3">
      </label>
    </div>
    <button id="pauseButton">⏸ Пауза</button>
  </div>

  <div id="pad" aria-label="Сенсорное управление">
    <span></span><button data-direction="forward" aria-label="Вперёд">▲</button><span></span>
    <button data-direction="left" aria-label="Влево">◀</button>
    <button data-direction="back" aria-label="Назад">▼</button>
    <button data-direction="right" aria-label="Вправо">▶</button>
  </div>

  <div id="overlay"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
